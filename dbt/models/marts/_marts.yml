version: 2

models:
  - name: fct_fights
    description: "One row per fight, enriched with event, venue, and both fighters' details."
    columns:
      - name: fight_id
        description: "Primary key for each fight."
        data_tests:
          - unique
          - not_null

      - name: event_id
        description: "Foreign key to the event this fight belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_events')
                field: event_id

      - name: fighter_1_id
        description: "Foreign key to the first fighter in the matchup. May not have a matching profile yet for unannounced 'Opponent TBD' placeholder slots on future cards."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fighter_profiles')
                field: fighter_id
              config:
                severity: warn

      - name: fighter_2_id
        description: "Foreign key to the second fighter in the matchup. May not have a matching profile yet for unannounced 'Opponent TBD' placeholder slots on future cards."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fighter_profiles')
                field: fighter_id
              config:
                severity: warn
      - name: status_detail
        description: "Human-readable version of status, e.g. 'Final' or 'Scheduled'. Null for upcoming fights, same as status."
      - name: finish_round
        description: "The round the fight ended in. Null for upcoming fights."
      - name: finish_time
        description: "Time within the ending round the fight was stopped, e.g. '1:38'. Null for upcoming fights."
      - name: method
        description: "How the fight ended, as ESPN's full string. For decisions this is the judges' scorecards, not a clean category — use method_short for grouping by finish type. Null for upcoming fights."
      - name: method_short
        description: "How the fight ended, as a short category (e.g. 'KO/TKO', 'U Dec'). Null for upcoming fights."
      - name: fighter_1_is_win
        description: "Whether fighter 1 won. False for both fighters on upcoming fights, not just losses — check status before treating false as a loss."
      - name: fighter_2_is_win
        description: "Whether fighter 2 won. False for both fighters on upcoming fights, not just losses — check status before treating false as a loss."
      - name: winner_fighter_id
        description: "The winning fighter's id. Null for upcoming fights, draws, and no-contests."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_fighter_profiles')
                field: fighter_id
              config:
                severity: warn
      - name: fighter_1_sig_str_lpm
        description: "Fighter 1's career significant strikes landed per minute, as of this fight."
      - name: fighter_1_sig_str_acc_pct
        description: "Fighter 1's career significant strike accuracy percentage, as of this fight."
      - name: fighter_1_td_avg
        description: "Fighter 1's career average takedowns landed per 15 minutes, as of this fight."
      - name: fighter_1_td_acc_pct
        description: "Fighter 1's career takedown accuracy percentage, as of this fight."
      - name: fighter_1_sub_avg
        description: "Fighter 1's career average submission attempts per 15 minutes, as of this fight."
      - name: fighter_2_sig_str_lpm
        description: "Fighter 2's career significant strikes landed per minute, as of this fight."
      - name: fighter_2_sig_str_acc_pct
        description: "Fighter 2's career significant strike accuracy percentage, as of this fight."
      - name: fighter_2_td_avg
        description: "Fighter 2's career average takedowns landed per 15 minutes, as of this fight."
      - name: fighter_2_td_acc_pct
        description: "Fighter 2's career takedown accuracy percentage, as of this fight."
      - name: fighter_2_sub_avg
        description: "Fighter 2's career average submission attempts per 15 minutes, as of this fight."

  - name: dim_fighters
    description: "One row per fighter, with bio, physical attributes and career record from their latest scraped profile"
    columns:
      - name: fighter_id
        description: "Primary key for each fighter."
        data_tests:
          - unique
          - not_null
      - name: date_of_birth
        description: "Fighter's date of birth. Null for fighters ESPN has no birth date on record for."
      - name: reach_inches
        description: "Fighter's reach in inches. Null for fighters with no reach measurement on ESPN."
      - name: tko_wins
        description: "Career wins by knockout or technical knockout."
      - name: tko_losses
        description: "Career losses by knockout or technical knockout."
      - name: sub_wins
        description: "Career wins by submission."
      - name: sub_losses
        description: "Career losses by submission."
