version: 2

models:
  - name: fct_fights
    description: "One row per fight, enriched with event, venue, and both fighters' details."
    columns:
      - name: fight_id
        description: "Primary key for each fight."
        data_tests:
          - unique
          - not_null

      - name: event_id
        description: "Foreign key to the event this fight belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_events')
                field: event_id

      - name: fighter_1_id
        description: "Foreign key to the first fighter in the matchup. May not have a matching profile yet for unannounced 'Opponent TBD' placeholder slots on future cards."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fighter_profiles')
                field: fighter_id
              config:
                severity: warn

      - name: fighter_2_id
        description: "Foreign key to the second fighter in the matchup. May not have a matching profile yet for unannounced 'Opponent TBD' placeholder slots on future cards."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fighter_profiles')
                field: fighter_id
              config:
                severity: warn
      - name: status_detail
        description: "Human-readable version of status, e.g. 'Final' or 'Scheduled'. Null for upcoming fights, same as status."
      - name: finish_round
        description: "The round the fight ended in. Null for upcoming fights."
      - name: finish_time
        description: "Time within the ending round the fight was stopped, e.g. '1:38'. Null for upcoming fights."
      - name: method
        description: "How the fight ended, as ESPN's full string. For decisions this is the judges' scorecards, not a clean category — use method_short for grouping by finish type. Null for upcoming fights."
      - name: method_short
        description: "How the fight ended, as a short category (e.g. 'KO/TKO', 'U Dec'). Null for upcoming fights."
      - name: fighter_1_is_win
        description: "Whether fighter 1 won. False for both fighters on upcoming fights, not just losses — check status before treating false as a loss."
      - name: fighter_2_is_win
        description: "Whether fighter 2 won. False for both fighters on upcoming fights, not just losses — check status before treating false as a loss."
      - name: winner_fighter_id
        description: "The winning fighter's id. Null for upcoming fights, draws, and no-contests."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_fighter_profiles')
                field: fighter_id
              config:
                severity: warn
      - name: fighter_1_sig_str_lpm
        description: "Fighter 1's career significant strikes landed per minute, as of this fight."
      - name: fighter_1_sig_str_acc_pct
        description: "Fighter 1's career significant strike accuracy percentage, as of this fight."
      - name: fighter_1_td_avg
        description: "Fighter 1's career average takedowns landed per 15 minutes, as of this fight."
      - name: fighter_1_td_acc_pct
        description: "Fighter 1's career takedown accuracy percentage, as of this fight."
      - name: fighter_1_sub_avg
        description: "Fighter 1's career average submission attempts per 15 minutes, as of this fight."
      - name: fighter_2_sig_str_lpm
        description: "Fighter 2's career significant strikes landed per minute, as of this fight."
      - name: fighter_2_sig_str_acc_pct
        description: "Fighter 2's career significant strike accuracy percentage, as of this fight."
      - name: fighter_2_td_avg
        description: "Fighter 2's career average takedowns landed per 15 minutes, as of this fight."
      - name: fighter_2_td_acc_pct
        description: "Fighter 2's career takedown accuracy percentage, as of this fight."
      - name: fighter_2_sub_avg
        description: "Fighter 2's career average submission attempts per 15 minutes, as of this fight."

  - name: dim_fighters
    description: "One row per fighter, with bio, physical attributes and career record from their latest scraped profile"
    columns:
      - name: fighter_id
        description: "Primary key for each fighter."
        data_tests:
          - unique
          - not_null
      - name: date_of_birth
        description: "Fighter's date of birth. Null for fighters ESPN has no birth date on record for."
      - name: reach_inches
        description: "Fighter's reach in inches. Null for fighters with no reach measurement on ESPN."
      - name: tko_wins
        description: "Career wins by knockout or technical knockout."
      - name: tko_losses
        description: "Career losses by knockout or technical knockout."
      - name: sub_wins
        description: "Career wins by submission."
      - name: sub_losses
        description: "Career losses by submission."

  - name: fct_ufcstats_fights
    description: "One row per fight, enriched with event and both fighters' details. Carries ufcstats' fight-specific stat breakdown (landed/attempted strikes and takedowns, control time, strike target zones), not just career averages."
    columns:
      - name: fight_id
        description: "Primary key for each fight."
        data_tests:
          - unique
          - not_null

      - name: event_id
        description: "Foreign key to the event this fight belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ufcstats_events')
                field: event_id

      - name: fighter_1_id
        description: "Foreign key to the first fighter in the matchup. ufcstats always lists the winner as fighter 1 in its own markup — fighter_1_result is never 'L'."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ufcstats_fighter_profiles')
                field: fighter_id
              config:
                severity: warn

      - name: fighter_2_id
        description: "Foreign key to the second fighter in the matchup. ufcstats always lists the loser as fighter 2 — fighter_2_result is never 'W'."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ufcstats_fighter_profiles')
                field: fighter_id
              config:
                severity: warn

      - name: fighter_1_result
        description: "Raw result code: 'W', 'D', 'NC', or null for a small number of fights where ufcstats' status badge didn't parse. Never 'L' — see fighter_1_id."
      - name: fighter_2_result
        description: "Raw result code: 'L', 'D', 'NC', or null for a small number of fights where ufcstats' status badge didn't parse. Never 'W' — see fighter_2_id."
      - name: winner_fighter_id
        description: "The winning fighter's id. Null for draws, no-contests, and fights with no parsed result."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ufcstats_fighter_profiles')
                field: fighter_id
              config:
                severity: warn
      - name: fighter_1_sig_str_pct
        description: "Null when fighter 1 attempted zero significant strikes."
      - name: fighter_1_td_pct
        description: "Null when fighter 1 attempted zero takedowns (ufcstats shows '---' rather than a percentage)."
      - name: fighter_1_control_time_seconds
        description: "Null when ufcstats shows '--' (no control time recorded), not zero seconds."
      - name: fighter_2_sig_str_pct
        description: "Null when fighter 2 attempted zero significant strikes."
      - name: fighter_2_td_pct
        description: "Null when fighter 2 attempted zero takedowns (ufcstats shows '---' rather than a percentage)."
      - name: fighter_2_control_time_seconds
        description: "Null when ufcstats shows '--' (no control time recorded), not zero seconds."

  - name: dim_ufcstats_fighter
    description: "One row per fighter, with bio, physical attributes and career record from their latest scraped ufcstats profile."
    columns:
      - name: fighter_id
        description: "Primary key for each fighter."
        data_tests:
          - unique
          - not_null
      - name: stance
        description: "Null when ufcstats shows '--' (no stance on record), rather than the literal placeholder string."
      - name: date_of_birth
        description: "Null for fighters ufcstats has no DOB on record for."
      - name: no_contests
        description: "Parsed separately from wins/losses/draws, since ufcstats tracks no-contests outside the W-L-D record (e.g. '28-1-0 (1 NC)'). Defaults to 0 when no NC suffix is present, not null."
