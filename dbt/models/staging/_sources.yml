version: 2

sources:
  - name: raw # logical name you'll reference in models
    database: ufc-data-pipeline # GCP project
    schema: raw # BigQuery dataset
    tables:
      - name: ufcstats_events
      - name: ufcstats_fighter_profiles
      - name: ufcstats_upcoming_index
        description: "Snapshot of ufcstats' upcoming-events page, one row per listed event per pipeline run (same loaded_at within a run). Used to detect events that dropped off the schedule."
